<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: block;
            padding: 40px;
        }
        .dashboard-hero {
            max-width: 900px;
            margin: 50px auto;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 60px;
            border-radius: 32px;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }
        .welcome-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        .logout-btn {
            margin-top: 40px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            width: auto;
            padding: 10px 30px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body>
    <div class="dashboard-hero">
        <span class="welcome-badge">Access Granted</span>
        <h1>Welcome, <span id="userNameDisplay">Student</span>!</h1>
        <p class="subtitle" style="margin-top: 10px;">Your academic portal is ready. Here's a quick look at your profile.</p>
        
        <div class="stats-grid">
            <div class="stat-card">
                <small style="color: var(--text-secondary)">Department</small>
                <div id="deptDisplay" style="font-size: 1.2rem; font-weight: 700; margin-top: 5px;">-</div>
            </div>
            <div class="stat-card">
                <small style="color: var(--text-secondary)">Reg Number</small>
                <div id="regDisplay" style="font-size: 1.2rem; font-weight: 700; margin-top: 5px;">-</div>
            </div>
            <div class="stat-card">
                <small style="color: var(--text-secondary)">Status</small>
                <div style="font-size: 1.2rem; font-weight: 700; margin-top: 5px; color: var(--success-color)">Active</div>
            </div>
        </div>

        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 50px;">
            <button class="run-btn" style="width: auto; padding: 12px 24px;" onclick="window.location.href='test_dashboard.html'">Open QA Dashboard</button>
            <button class="logout-btn" style="margin-top: 0;" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <script>
        // Use sessionStorage or URL params if needed, but here we'll use a "current_user" key from localStorage
        const user = JSON.parse(localStorage.getItem('current_user'));
        
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userNameDisplay').innerText = user.name;
            document.getElementById('deptDisplay').innerText = user.department;
            document.getElementById('regDisplay').innerText = user.regno;
        }

        function logout() {
            localStorage.removeItem('current_user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
