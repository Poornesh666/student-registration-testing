<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Join the Portal</h2>
        <p class="subtitle">Complete the form to register as a student</p>
        
        <form id="registrationForm" onsubmit="return validateRegistration()">
            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" placeholder="Full Name">
            </div>
            
            <div class="form-group">
                <label for="regno">Register Number (e.g., 23MIS0146)</label>
                <input type="text" id="regno" placeholder="Reg No.">
            </div>
            
            <div class="form-group">
                <label for="email">Institutional Email</label>
                <input type="email" id="email" placeholder="example@university.edu">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label for="department">Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="CSE">CSE</option>
                    <option value="IT">IT</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="Mechanical">Mechanical</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="gender">Gender Identity</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <button type="submit" id="registerBtn">Create Account</button>
            <p id="message"></p>
            
            <div class="link-group">
                Already registered? <a href="login.html">Sign In Here</a>
            </div>
        </form>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
